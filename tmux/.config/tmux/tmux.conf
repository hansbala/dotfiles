set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',*256col*:Tc'
set -g extended-keys
set -g extended-keys-format csi-u
unbind C-b
set -g prefix '\'
set -g mouse on
setw -g mode-keys vi

# Start pane+window numbering from 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g automatic-rename off
set-option -sg escape-time 10
set -g history-limit 100000

# New pane and window settings and killing panes
unbind '"'
unbind %
unbind x
bind '"' split-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# General bindings
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind x kill-pane
bind '\' send-prefix
bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf
unbind \'
bind \' set -g status

# tmux notifications
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none
set-window-option -g monitor-activity off

#set -g mode-keys vi
#bind-key -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# Theme: monochrome, using spacing and weight for hierarchy.
# Inheriting the terminal colours keeps it native in both light and dark modes.
set -g status-position bottom
set -g status-interval 5
set -g status-justify absolute-centre
set -g status-left-length 30
set -g status-right-length 60
set -g status-style 'bg=default,fg=default'
set -g status-left ' #[bold]#S#[default] '
set -g status-right '#[dim]%a %d %b#[default]  #[bold]%I:%M %p#[default] '
set -g window-status-separator '  '
set-window-option -g window-status-format '#[dim]#I:#W#F#[default]'
set-window-option -g window-status-current-format '#[bold,underscore]#I:#W#F#[default]'
set-window-option -g window-status-activity-style 'bold'

# Keep tmux prompts and pane borders in the same palette.
set -g message-style 'reverse,bold'
set -g mode-style 'reverse,bold'
set -g pane-border-style 'dim'
set -g pane-active-border-style 'fg=default'

# copy and paste stuff
# macOS only
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# To copy, left click and drag to highlight text in yellow, 
# once you release left click yellow text will disappear and will automatically be available in clibboard
# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "tmux-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "tmux-copy"
